<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta
    name="description"
    content="A beautiful collection of birthday memories."
  />

  <title>Memory Lane - Birthday Memories</title>

  <link rel="stylesheet" href="memorylane.css" />
</head>

<body>

  <!-- =========================================
       BACKGROUND
  ========================================== -->

  <div class="scrapbook-bg"></div>

  <!-- =========================================
       CONFETTI
  ========================================== -->

  <div
    class="confetti"
    id="confetti-container"
    aria-hidden="true"
  ></div>

  <!-- =========================================
       FLOATING BALLOONS
  ========================================== -->

  <div
    class="balloon balloon-1"
    aria-hidden="true"
  ></div>

  <div
    class="balloon balloon-2"
    aria-hidden="true"
  ></div>

  <div
    class="balloon balloon-3"
    aria-hidden="true"
  ></div>

  <div
    class="balloon balloon-4"
    aria-hidden="true"
  ></div>

  <div
    class="balloon balloon-5"
    aria-hidden="true"
  ></div>

  <!-- =========================================
       DECORATIVE STICKERS
  ========================================== -->

  <div class="sticker sticker1" aria-hidden="true">✨</div>
  <div class="sticker sticker2" aria-hidden="true">♥</div>
  <div class="sticker sticker3" aria-hidden="true">★</div>
  <div class="sticker sticker4" aria-hidden="true">✦</div>

  <!-- =========================================
       MAIN MEMORY LANE
  ========================================== -->

  <main class="memory-lane-container">

    <!-- HEADER -->

    <header class="header">

      <h1>Our Memory Lane</h1>

      <p>
        A journey through the most incredible moments we've shared together.
        Hover over each photo to see why these memories mean so much to me.
        ✨💖
      </p>

    </header>


    <!-- =========================================
         SLIDESHOW CONTROLS
    ========================================== -->

    <div class="slideshow-controls">

      <button
        id="startSlideshow"
        class="btn"
        type="button"
      >
        <span>▶ Start Slideshow</span>
      </button>

      <button
        id="pauseSlideshow"
        class="btn"
        type="button"
        hidden
      >
        <span>⏸ Pause Slideshow</span>
      </button>

    </div>


    <!-- =========================================
         GALLERY
         
         JavaScript will generate all 22 cards here.
    ========================================== -->

    <section
      class="gallery-container"
      aria-label="Birthday memories gallery"
    >

      <div
        class="gallery"
        id="memoryGallery"
      ></div>

    </section>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <nav
      class="navigation-buttons"
      aria-label="Birthday navigation"
    >

      <button
        id="backButton"
        class="btn"
        type="button"
      >
        <span>← Back to Welcome</span>
      </button>

      <button
        id="nextButton"
        class="btn"
        type="button"
        hre
      >
        <span>✨ Next Surprise! ✨</span>
      </button>

    </nav>

  </main>


  <!-- =========================================
       GSAP
  ========================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"
  ></script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"
  ></script>


  <!-- =========================================
       MEMORY LANE JAVASCRIPT
  ========================================== -->

  <script src="memorylane.js"></script>

</body>
</html>
